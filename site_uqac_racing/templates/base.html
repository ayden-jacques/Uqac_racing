<!DOCTYPE html>
<html lang="en">
<script src="https://cdn.tailwindcss.com"></script>

<body class = "min-h-screen bg-gradient-to-b from-neutral-700 via-neutral-750 to-neutral-800">
    <header class="w-full flex items-center bg-zinc-800 text-gray-300 p-4">
  
        <!-- 1. Conteneur Logo (utilisez w-auto pour laisser le logo prendre sa place) -->
        <div class="flex-shrink-0">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="image de logo" class="h-16 w-auto object-contain">
        </div>

        <!-- 2. Liens de navigation centrés -->
        <div class="flex-1 flex justify-center space-x-6">
            <a class="liens {% if request.path == url_for('acceuil') %}actif{% endif %}" href="{{ url_for('acceuil') }}" {% if request.path == url_for('acceuil') %}aria-current="page"{% endif %}>Accueil</a>
            <a class="liens {% if request.path == url_for('commanditaire') %}actif{% endif %}" href="{{ url_for('commanditaire') }}" {% if request.path == url_for('commanditaire') %}aria-current="page"{% endif %}>Commanditaire</a>
            <a class="liens {% if request.path == url_for('equipe') %}actif{% endif %}" href="{{ url_for('equipe') }}" {% if request.path == url_for('equipe') %}aria-current="page"{% endif %}>Équipe</a>
            <a class="liens {% if request.path == url_for('galerie') %}actif{% endif %}" href="{{ url_for('galerie') }}" {% if request.path == url_for('galerie') %}aria-current="page"{% endif %}>Galerie</a>
            <a class="liens {% if request.path == url_for('voiture') %}actif{% endif %}" href="{{ url_for('voiture') }}" {% if request.path == url_for('voiture') %}aria-current="page"{% endif %}>Voiture</a>
            <a class="liens {% if request.path == url_for('contact') %}actif{% endif %}" href="{{ url_for('contact') }}" {% if request.path == url_for('contact') %}aria-current="page"{% endif %}>Contact</a>
        </div>

    </header>
    
    
    
    <main>
       
        <div class="texte">
            
            <img class="image" src="{{ url_for('static', filename='background.png') }}" alt="logo">
        
            
            <div >
                
                {% block content%} {%endblock%}
            </div>
            
        </div>
    
</body>
</html>
<style>
    .liens{
        padding: 10px;
        border-radius: 5px;
        transition: all 0.3s ease;
    }
    .liens:hover{
        color : #236837;
    }
    .liens.actif{
        color: #236837;
        font-weight: bold;
        border-bottom: 2px solid #236837;
    }

    .image{
        position: absolute;
        top: 10;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
    }

</style>
